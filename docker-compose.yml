services:
  postgres:
    image: postgres:16
    container_name: autoad_postgres
    environment:
      POSTGRES_USER: autoad
      POSTGRES_PASSWORD: autoad
      POSTGRES_DB: autoad_dev
    ports:
      - "5432:5432"
    volumes:
      - autoad_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoad -d autoad_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  autoad_pgdata:
